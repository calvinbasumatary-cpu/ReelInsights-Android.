
name: Build Reel Insights APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: ReelInsights-GitHub-APK
        run: npm install

      - name: Create Android project
        working-directory: ReelInsights-GitHub-APK
        run: npx cap add android

      - name: Sync HTML
        working-directory: ReelInsights-GitHub-APK
        run: npx cap sync android

      - name: Build APK
        working-directory: ReelInsights-GitHub-APK/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Insights-APK
          path: ReelInsights-GitHub-APK/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
